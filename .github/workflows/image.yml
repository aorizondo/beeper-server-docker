name: image

# Builds the image and pushes it to the repository owner's GitHub Container Registry.
# The package is private by default; keep it that way (it contains Beeper's software).
on:
  push:
    branches: [main]
    paths: [Dockerfile, start.sh, beeper-setup.sh, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Beeper Server version
        id: version
        run: echo "beeper=$(sed -n 's/^ARG BEEPER_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beeper-server:latest
            ghcr.io/${{ github.repository_owner }}/beeper-server:${{ steps.version.outputs.beeper }}
